# Gallery — production compose (IONOS, behind host nginx).
# The app publishes to 127.0.0.1:8090; the host's nginx reverse-proxies the
# domain to it and terminates TLS. No Caddy (nginx already owns 80/443 on this
# shared box, which also runs other sites).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gallery
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: gallery
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    command: postgres -c shared_buffers=512MB -c effective_cache_size=1GB -c max_connections=50
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gallery"]
      interval: 10s
      retries: 5
  app:
    build: ../app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    ports:
      - "127.0.0.1:8090:3000"
    # NOT ./data/thumbs — that resolves under /root (this repo lives at
    # /root/pr-gallery), and /root is 0700, so host nginx (running as an
    # unprivileged user) can't traverse into it to serve /thumbs/ no matter
    # what the files themselves are chmod'd to. /srv is a normal top-level
    # directory nginx can already reach. See "Thumbnails 403" in HANDOFF.md
    # for the one-time host migration this requires.
    volumes:
      - /srv/msc-thumbs:/app/public/thumbs
  worker:
    build: ../worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      SELF_URL: "http://app:3000"
