# Host nginx site for the gallery. Lives at:
#   /etc/nginx/sites-available/gallery.memorialstairclimb.co.uk
# symlinked into sites-enabled. certbot --nginx adds the TLS/443 block.
server {
    listen 80;
    server_name gallery.memorialstairclimb.co.uk;

    location /thumbs/ {
        alias /root/pr-gallery/deploy/data/thumbs/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        location ~ ^/thumbs/preview/ {
            alias /root/pr-gallery/deploy/data/thumbs/preview/;
            add_header Content-Disposition 'inline; filename="PREVIEW-lowres-DO-NOT-USE.jpg"';
        }
    }
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 200m;
        proxy_read_timeout 300s;
    }
}
