# Host nginx site for the gallery. Lives at:
#   /etc/nginx/sites-available/gallery.memorialstairclimb.co.uk
# symlinked into sites-enabled. certbot --nginx adds the TLS/443 block.
server {
    listen 80;
    server_name gallery.memorialstairclimb.co.uk;

    # NOT /root/pr-gallery/deploy/data/thumbs — /root is 0700, so nginx can't
    # traverse into it no matter what the files are chmod'd to (every request
    # 403s). /srv/msc-thumbs is bind-mounted here instead; see the "Thumbnails
    # 403" section of HANDOFF.md for the one-time host migration.
    location /thumbs/ {
        alias /srv/msc-thumbs/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        location ~ ^/thumbs/preview/ {
            alias /srv/msc-thumbs/preview/;
            add_header Content-Disposition 'inline; filename="PREVIEW-lowres-DO-NOT-USE.jpg"';
        }
    }

    # Zip downloads (whole gallery / album / cart selection) stream through
    # the app for a long time on a big selection. Without this block nginx's
    # default proxy buffering + read timeout can 502 a slow or large stream —
    # buffering off passes bytes straight through instead of trying to
    # accumulate the whole response first.
    location ~ ^/g/[^/]+/download {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 200m;
        proxy_read_timeout 300s;
    }
}
