# Host nginx site for the gallery. Lives at:
#   /etc/nginx/sites-available/gallery.memorialstairclimb.co.uk
#   (symlinked into sites-enabled)
#
# This file mirrors the LIVE, certbot-modified structure exactly — two
# server blocks, the real one on :443 (certbot adds this on top of a plain
# :80 block the first time it runs) and a bare :80 block that only
# redirects to https. That's not cosmetic: every location block — the
# download timeout override below included — MUST live inside the :443
# server block, because that's the only one actually proxying to the app.
# certbot does NOT re-copy later manual edits to the :80 block into the
# :443 one, so adding a block only to :80 (or only to a plain single-block
# reference file without this split) silently does nothing for real
# HTTPS traffic. This has bitten the download route twice already —
# see "504 on downloads" in HANDOFF.md before touching this file again.
server {
    server_name gallery.memorialstairclimb.co.uk;

    # NOT /root/pr-gallery/deploy/data/thumbs — /root is 0700, so nginx can't
    # traverse into it no matter what the files are chmod'd to (every request
    # 403s). /srv/msc-thumbs is bind-mounted here instead; see the "Thumbnails
    # 403" section of HANDOFF.md for the one-time host migration.
    location /thumbs/ {
        alias /srv/msc-thumbs/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        location ~ ^/thumbs/preview/ {
            alias /srv/msc-thumbs/preview/;
            add_header Content-Disposition 'inline; filename="PREVIEW-lowres-DO-NOT-USE.jpg"';
        }
    }

    # Zip downloads (whole gallery / album / cart selection) stream through
    # the app for a long time on a big selection, and can be genuinely large
    # for a video album. Without this block, nginx's DEFAULTS apply instead
    # (proxy_buffering on, a short proxy_read_timeout) — buffering on means
    # nginx tries to accumulate the ENTIRE zip before forwarding any of it to
    # the client, which for a multi-GB video album can take far longer than
    # any reasonable timeout and 504s even though the app itself is streaming
    # correctly the whole time. This must be a regex location (matched
    # ahead of the plain `location /` prefix regardless of file order) so it
    # actually overrides the defaults for this one path.
    location ~ ^/g/[^/]+/download {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 200m;
        proxy_read_timeout 300s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/gallery.memorialstairclimb.co.uk/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/gallery.memorialstairclimb.co.uk/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = gallery.memorialstairclimb.co.uk) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name gallery.memorialstairclimb.co.uk;
    return 404; # managed by Certbot
}
